<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Topic API Demo</title>
  <style>
    body {font-family: Arial, sans-serif; margin: 2rem;}
    #result {white-space: pre; background:#f5f5f5; padding:1rem; border:1px solid #ddd;}
    button {padding:0.5rem 1rem; font-size:1rem;}
  </style>
</head>
<body>
  <h1>Topic API Demo</h1>
  <p>Click the button to call <code>POST /api/topic/discover</code> and display the response.</p>
  <button id="callBtn">Call Topic API</button>
  <h2>Result</h2>
  <div id="result">(no data yet)</div>

  <script>
    document.getElementById('callBtn').addEventListener('click', async () => {
      const resultDiv = document.getElementById('result');
      resultDiv.textContent = 'Loading...';
      try {
        const response = await fetch('http://127.0.0.1:8000/api/topic/discover', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ query: 'test' })
        });
        const data = await response.json();
        resultDiv.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        resultDiv.textContent = 'Error: ' + err;
      }
    });
  </script>
</body>
</html>
