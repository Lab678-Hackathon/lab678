<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- 모바일 레이아웃 뷰포트 = 실제 기기 폭 (없으면 에뮬레이션이 980px로 렌더) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>KONNECT</title>
  <link rel="icon" href="assets/favicon.svg?v=1" type="image/svg+xml" />
  <!-- Inter (디자인 정본 글자체). 미로드 시 기기 기본 폰트로 떨어져 디자인과 어긋남 → 명시 로드.
       Regular 400 / Medium 500 / Semi Bold 600 / Bold 700 (tokens.css 굵기 매핑과 일치). -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="css/tokens.css?v=2" />
  <link rel="stylesheet" href="css/app.css?v=27" />
  <!-- 스플래시: 모듈/CSS 로드 전에 즉시 페인트되도록 스타일을 인라인으로 둔다.
       부팅 시 authReady()가 백엔드(/api/config)를 부르므로 Render 콜드스타트에선
       첫 화면까지 수십 초 #view 가 빈 화면이다 — 그 공백을 이 스플래시가 덮는다.
       배경 그라디언트는 welcome(.welcome)과 동일 → 첫 뷰로 매끄럽게 전환. -->
  <style>
    #splash {
      position: absolute; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 20px; text-align: center;
      background: linear-gradient(180deg, #7fc2cd 0%, #a9d6d4 42%, #d9ebe5 72%, #f4f6f7 100%);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity 0.4s ease;
    }
    #splash.is-hiding { opacity: 0; pointer-events: none; }
    #splash .splash-logo { margin: 0; font-size: 34px; font-weight: 800; letter-spacing: 0.06em; color: #0b4651; }
    #splash .splash-tagline { margin: 6px 0 0; font-size: 13px; font-weight: 600; color: #15606b; }
    #splash .splash-spinner {
      width: 30px; height: 30px; border-radius: 50%;
      border: 3px solid rgba(11, 70, 81, 0.18); border-top-color: #0b4651;
      animation: splash-spin 0.8s linear infinite;
    }
    #splash .splash-status {
      min-height: 16px; max-width: 260px; padding: 0 20px;
      font-size: 12px; line-height: 1.4; color: #2c6f78;
      opacity: 0; transition: opacity 0.4s ease;
    }
    #splash .splash-status.show { opacity: 1; }
    @keyframes splash-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #splash .splash-spinner { animation: none; } }
  </style>
</head>
<body>
  <!-- 모바일: 화면 꽉 채움. 데스크톱: 중앙 컬럼(a-bly식). -->
  <div class="device-frame">
    <!-- 콜드스타트 스플래시 — device-frame 안에 두어 데스크톱 모바일 목업 영역에만 표시.
         첫 뷰가 mount 되면 app.js 가 내린다(1회성, 이후 DOM 제거). -->
    <div id="splash" role="status" aria-live="polite">
      <h1 class="splash-logo">KONNECT</h1>
      <p class="splash-tagline">Seoul culture, made doable</p>
      <div class="splash-spinner" aria-hidden="true"></div>
      <p class="splash-status" id="splash-status">Waking up the service — first load can take a moment.</p>
    </div>
    <main id="view" class="app" aria-live="polite"><!-- 뷰는 app.js가 주입 --></main>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
