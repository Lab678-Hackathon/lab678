<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Hackathon Framework</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/tokens.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      background: var(--color-bg);
      color: var(--color-text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      max-width: var(--max-width);
      margin: 0 auto;
    }
    #nav {
      display: flex;
      gap: var(--space-1);
      padding: var(--space-2) var(--gutter);
      border-bottom: 1px solid var(--color-border);
      background: var(--color-bg);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .nav-item {
      flex: 1;
      padding: var(--space-2) var(--space-3);
      border: none;
      border-radius: var(--radius-md);
      background: transparent;
      color: var(--color-text-muted);
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-medium);
      cursor: pointer;
      transition: background var(--transition-fast);
    }
    .nav-item:hover { background: var(--color-bg-subtle); }
    .nav-item.active {
      background: var(--color-brand-50);
      color: var(--color-brand-600);
      font-weight: var(--font-weight-semibold);
    }
    #view {
      flex: 1;
      padding: var(--space-4) var(--gutter);
      overflow-y: auto;
    }
  </style>
  <script>
    /* 백엔드 URL·Supabase 설정을 서버 또는 빌드 단계에서 주입.
       로컬 개발: 하드코딩하거나 /api/config 엔드포인트로 로드. */
    window.__APP_CONFIG__ = {
      supabaseUrl: "",
      supabaseKey: "",
      apiBase: "",
    };
  </script>
</head>
<body>
  <nav id="nav"></nav>
  <main id="view">
    <p style="color:var(--color-text-muted);margin-top:2rem;text-align:center">
      Loading…
    </p>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
