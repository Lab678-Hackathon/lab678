<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Simple Demo</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 2rem; }
        #result { white-space: pre-wrap; margin-top: 1rem; background:#f5f5f5; padding:1rem; border:1px solid #ccc; }
    </style>
</head>
<body>
    <h1>FastAPI Topic API Demo</h1>
    <button id="callBtn">Call Topic API</button>
    <div id="result"></div>
    <script>
        document.getElementById('callBtn').addEventListener('click', async () => {
            try {
                const resp = await fetch('http://127.0.0.1:8000/api/topic/discover', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: 'sample' })
                });
                const data = await resp.json();
                document.getElementById('result').textContent = JSON.stringify(data, null, 2);
            } catch (e) {
                document.getElementById('result').textContent = 'Error: ' + e;
            }
        });
    </script>
</body>
</html>
