<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="3024" viewBox="0 0 1500 3024"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker></defs><rect width="1500" height="3024" fill="white"/><text x="60" y="52" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="34" font-weight="700" fill="#111827">KONNECT 서비스 전반 IA 사이트맵</text><text x="60" y="83" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="16" font-weight="400" fill="#64748B">2026-10-06 기획 IA · Depth 계층 요약 · LF-01~09 기본 / LF-10 조건부</text><rect x="60" y="105" width="18" height="18" rx="4" fill="#EEF1FF" stroke="#6C7CFF"/><text x="87" y="120" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="13" font-weight="400" fill="#334155">사용자 흐름 / 공통</text><rect x="340" y="105" width="18" height="18" rx="4" fill="#ECFFF4" stroke="#39D98A"/><text x="367" y="120" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="13" font-weight="400" fill="#334155">맥락 / 상태</text><rect x="610" y="105" width="18" height="18" rx="4" fill="#FFF3E8" stroke="#FF9A42"/><text x="637" y="120" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="13" font-weight="400" fill="#334155">시스템 / 대체 처리</text><rect x="900" y="105" width="18" height="18" rx="4" fill="#FFF0F7" stroke="#F46BB7"/><text x="927" y="120" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="13" font-weight="400" fill="#334155">신뢰 / 정책</text><rect x="1150" y="105" width="18" height="18" rx="4" fill="#F4F7FA" stroke="#B7C2CF"/><text x="1177" y="120" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="13" font-weight="400" fill="#334155">Stretch</text><rect x="60" y="150" width="1380" height="190" rx="18" fill="white" stroke="#6C7CFF" stroke-width="2"/><path d="M78 150 H1422 Q1440 150 1440 168 V203 H60 V168 Q60 150 78 150" fill="#EEF1FF"/><text x="82" y="185" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="22" font-weight="700" fill="#111827">1. 메인 / 진입 · LF-01</text><text x="82" y="225" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="17" font-weight="400" fill="#334155">  서비스 소개 · 핵심 모드 선택: A 즉시 추천 / B 특정 날짜 문화루트</text><text x="82" y="256" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="17" font-weight="400" fill="#334155">  로그인 / 사용자 식별 · 기본 안내 / 신뢰 고지</text><text x="82" y="287" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="17" font-weight="400" fill="#334155">  현재 선택으로 돌아가기 → LF-09</text><rect x="60" y="365" width="675" height="690" rx="18" fill="white" stroke="#6C7CFF" stroke-width="2"/><path d="M78 365 H717 Q735 365 735 383 V418 H60 V383 Q60 365 78 365" fill="#EEF1FF"/><text x="82" y="400" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="22" font-weight="700" fill="#111827">2. 즉시 추천 A</text><text x="82" y="440" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="16" font-weight="400" fill="#334155">  조건 설정 · LF-02</text><text x="82" y="484" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="16" font-weight="400" fill="#334155">    현재 위치·시각·가용시간 / 관심사·예산·이동 조건 선택</text><text x="82" y="528" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="16" font-weight="400" fill="#334155">    기존 여행계획 맥락 선택형 연결</text><text x="82" y="572" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="16" font-weight="400" fill="#334155">  추천 결과 · LF-03</text><text x="82" y="616" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="16" font-weight="400" fill="#334155">    조건 충족 / 추가 확인 필요 / 조건 완화 대안 → 비교</text><text x="82" y="660" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="16" font-weight="400" fill="#334155">    적합 후보 없음 → 0건 안내·조건 조정</text><text x="82" y="704" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="16" font-weight="400" fill="#334155">  경험 상세 · LF-06 → 공식 확인 경로</text><text x="82" y="748" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="16" font-weight="400" fill="#334155">  이동 판단 · A LF-03 통합 지도</text><text x="82" y="792" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="16" font-weight="400" fill="#334155">    검증된 구간만 경로선 + 신뢰 가능한 시간·거리</text><text x="82" y="836" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="16" font-weight="400" fill="#334155">    부족하면 핀·확인 가능한 이동정보·외부 지도 연결</text><text x="82" y="880" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="16" font-weight="400" fill="#334155">  LF-03에서 Select experience로 확정 → LF-09 재접근</text><text x="82" y="924" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="16" font-weight="400" fill="#334155">    별도 저장 단계 없음 · 선택 ≠ 예약·참여·방문</text><rect x="765" y="365" width="675" height="690" rx="18" fill="white" stroke="#6C7CFF" stroke-width="2"/><path d="M783 365 H1422 Q1440 365 1440 383 V418 H765 V383 Q765 365 783 365" fill="#EEF1FF"/><text x="787" y="400" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="22" font-weight="700" fill="#111827">3. 특정 날짜 문화루트 B</text><text x="787" y="440" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="16" font-weight="400" fill="#334155">  루트 조건 설정 · LF-04</text><text x="787" y="484" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="16" font-weight="400" fill="#334155">    날짜·시작점·시작·종료 필수 4값 / 관심사 등 선택 맥락</text><text x="787" y="528" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="16" font-weight="400" fill="#334155">    미래 날짜에 현재 GPS를 시작점으로 자동 가정하지 않음</text><text x="787" y="572" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="16" font-weight="400" fill="#334155">  문화루트 결과 · LF-05</text><text x="787" y="616" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="16" font-weight="400" fill="#334155">    2~3개 경험·순서 / 2개 조합 실패 시 개별 추천·실패</text><text x="787" y="660" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="16" font-weight="400" fill="#334155">    현재 루트 편집·복구와 새 후보 조합 요청을 구분</text><text x="787" y="704" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="16" font-weight="400" fill="#334155">  경험 상세 · LF-06 → 공식 확인 경로</text><text x="787" y="748" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="16" font-weight="400" fill="#334155">  이동 판단 · B 루트 지도 LF-08</text><text x="787" y="792" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="16" font-weight="400" fill="#334155">    시작점 → 장소 1 → 2(→ 3), 번호와 장소명 대응</text><text x="787" y="836" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="16" font-weight="400" fill="#334155">    일부 미확인 유지 · 근거 있는 구간만 거리/시간 표시</text><text x="787" y="880" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="16" font-weight="400" fill="#334155">  LF-08에서 루트 확정 → LF-09 이후 재접근</text><text x="787" y="924" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="16" font-weight="400" fill="#334155">    별도 저장 단계 없음 · 선택 ≠ 예약·참여·방문</text><rect x="60" y="1080" width="675" height="320" rx="18" fill="white" stroke="#39D98A" stroke-width="2"/><path d="M78 1080 H717 Q735 1080 735 1098 V1133 H60 V1098 Q60 1080 78 1080" fill="#ECFFF4"/><text x="82" y="1115" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="22" font-weight="700" fill="#111827">4. 기존 여행계획 맥락</text><text x="82" y="1155" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="17" font-weight="400" fill="#334155">  일정 없음 → 건너뛰기</text><text x="82" y="1203" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="17" font-weight="400" fill="#334155">  다음 고정 일정의 시간·장소 → 선택형 입력</text><text x="82" y="1251" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="17" font-weight="400" fill="#334155">  전체 일정 추가 → AI 구조화 → 핵심 모호값 확인</text><text x="82" y="1299" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="17" font-weight="400" fill="#334155">  A/B에 필요한 값만 활용; 전체 여행 플래너 아님</text><rect x="765" y="1080" width="675" height="320" rx="18" fill="white" stroke="#6C7CFF" stroke-width="2"/><path d="M783 1080 H1422 Q1440 1080 1440 1098 V1133 H765 V1098 Q765 1080 783 1080" fill="#EEF1FF"/><text x="787" y="1115" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="22" font-weight="700" fill="#111827">5. 공통 경험 정보 · LF-06</text><text x="787" y="1155" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="17" font-weight="400" fill="#334155">  결과 상태 → 추천 이유 → 시간 적합성 → 가격</text><text x="787" y="1203" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="17" font-weight="400" fill="#334155">  이동 부담 → 예약·참여 조건 → 미확인 정보</text><text x="787" y="1251" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="17" font-weight="400" fill="#334155">  확인 사실 / KONNECT 계산·판단 / 공식 확인 필요</text><text x="787" y="1299" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="17" font-weight="400" fill="#334155">  공식 상세·예약·확인 경로(필요한 경우)</text><rect x="60" y="1425" width="675" height="300" rx="18" fill="white" stroke="#6C7CFF" stroke-width="2"/><path d="M78 1425 H717 Q735 1425 735 1443 V1478 H60 V1443 Q60 1425 78 1425" fill="#EEF1FF"/><text x="82" y="1460" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="22" font-weight="700" fill="#111827">6. 외부 연결 / 다음 행동</text><text x="82" y="1500" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="17" font-weight="400" fill="#334155">  공식 상세 페이지 · 공식 예약/확인 경로(해당 시)</text><text x="82" y="1547" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="17" font-weight="400" fill="#334155">  외부 지도 앱에서 상세 길찾기</text><text x="82" y="1594" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="17" font-weight="400" fill="#334155">  내부 턴바이턴 내비게이션·예약·결제 없음</text><text x="82" y="1641" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="17" font-weight="400" fill="#334155">  실제 경로 없는 직선을 도보 경로로 표시하지 않음</text><rect x="765" y="1425" width="675" height="300" rx="18" fill="white" stroke="#39D98A" stroke-width="2"/><path d="M783 1425 H1422 Q1440 1425 1440 1443 V1478 H765 V1443 Q765 1425 783 1425" fill="#ECFFF4"/><text x="787" y="1460" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="22" font-weight="700" fill="#111827">7. 사용자 상태 / 계정</text><text x="787" y="1500" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="17" font-weight="400" fill="#334155">  로그인 / 사용자 식별 · P-09 최초 가입 선호 · My Page</text><text x="787" y="1540" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="17" font-weight="400" fill="#334155">  현재 선택 상태 · LF-09 (A 장소 / B 루트)</text><text x="787" y="1580" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="17" font-weight="400" fill="#334155">    B 장소·순서·예정시간·미확인 상태 유지 · 선택 ≠ 방문</text><text x="787" y="1620" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="17" font-weight="400" fill="#334155">  방문 후 최소 피드백 · LF-10 [조건부]</text><text x="787" y="1660" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="17" font-weight="400" fill="#334155">    개발 구현 가능 확인 완료 · MVP 포함 조건부</text><rect x="60" y="1750" width="675" height="360" rx="18" fill="white" stroke="#FF9A42" stroke-width="2"/><path d="M78 1750 H717 Q735 1750 735 1768 V1803 H60 V1768 Q60 1750 78 1750" fill="#FFF3E8"/><text x="82" y="1785" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="22" font-weight="700" fill="#111827">8. 시스템 / 예외 상태</text><text x="82" y="1825" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="17" font-weight="400" fill="#334155">  위치 권한 거부 → 직접 입력</text><text x="82" y="1872" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="17" font-weight="400" fill="#334155">  핵심 입력 모호 → 필요한 값만 확인</text><text x="82" y="1919" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="17" font-weight="400" fill="#334155">  A 적합 후보 없음 → 0건 안내·조건 조정</text><text x="82" y="1966" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="17" font-weight="400" fill="#334155">  B 조합 실패 → 개별 추천 또는 루트 실패</text><text x="82" y="2013" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="17" font-weight="400" fill="#334155">  데이터 / AI / 네트워크 오류 → 재시도·안내</text><text x="82" y="2060" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="17" font-weight="400" fill="#334155">  정상 결과 상태와 시스템 예외를 구분</text><rect x="765" y="1750" width="675" height="360" rx="18" fill="white" stroke="#F46BB7" stroke-width="2"/><path d="M783 1750 H1422 Q1440 1750 1440 1768 V1803 H765 V1768 Q765 1750 783 1750" fill="#FFF0F7"/><text x="787" y="1785" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="22" font-weight="700" fill="#111827">9. 신뢰 / 동의 / 정책</text><text x="787" y="1825" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="17" font-weight="400" fill="#334155">  AI 관여 고지</text><text x="787" y="1872" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="17" font-weight="400" fill="#334155">  확인된 사실 / KONNECT 판단 / 미확인 구분</text><text x="787" y="1919" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="17" font-weight="400" fill="#334155">  미확인 ≠ 무료·예약 불필요·참여 보장</text><text x="787" y="1966" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="17" font-weight="400" fill="#334155">  위치 정보·여행계획 데이터 사용 안내</text><text x="787" y="2013" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="17" font-weight="400" fill="#334155">  개인정보 안내·이용약관 구현은 개발 후속</text><rect x="60" y="2135" width="1380" height="185" rx="18" fill="white" stroke="#B7C2CF" stroke-width="2"/><path d="M78 2135 H1422 Q1440 2135 1440 2153 V2188 H60 V2153 Q60 2135 78 2135" fill="#F4F7FA"/><text x="82" y="2170" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="22" font-weight="700" fill="#111827">10. 확장 영역 (Stretch) · MVP OUT</text><text x="82" y="2210" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="18" font-weight="400" fill="#334155">  Photo Challenge · Stamp</text><text x="82" y="2259" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="18" font-weight="400" fill="#334155">  방문 후 최소 피드백 LF-10은 이 확장 기능들과 별개인 조건부 기획 안</text><text x="60" y="2390" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="23" font-weight="700" fill="#111827">시각화 읽기</text><text x="60" y="2430" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="17" font-weight="400" fill="#334155">Depth 1은 서비스 영역, 하위 항목은 기능·상태·연결 경로입니다. 정확한 IA ID·범위는 Sheet 「IA 작업맵」을 확인합니다.</text><text x="60" y="2475" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="17" font-weight="400" fill="#334155">A는 LF-03 통합 지도, B는 LF-08에서 검증된 이동정보만 표시하며 LF-09은 실제 확정 선택 상태를 유지합니다.</text><text x="60" y="2520" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="17" font-weight="400" fill="#334155">기획 사용자 흐름 단계와 UX 화면은 1:1로 고정되지 않습니다. 실제 화면 통합·분리는 UX/UI 재량입니다.</text><text x="60" y="2565" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="17" font-weight="400" fill="#334155">H3/D-17 사용자 검증은 선택 사항입니다. LF-10은 구현 가능 확인 완료·MVP 포함 조건부입니다.</text><text x="60" y="2895" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="16" font-weight="400" fill="#64748B">상세 Source: 「KONNECT 제품 기획 기준서」 §11–12 / Google Sheet 「IA 구조도」·「IA 작업맵」</text></svg>