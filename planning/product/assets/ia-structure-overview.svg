50 V168 Q450 150 468 150" fill="#EEF1FF"/><text x="472" y="185" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="23" font-weight="700" fill="#111827">1. 진입 / LF-01</text><text x="472" y="225" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="17" font-weight="400" fill="#334155">A 즉시 추천 또는 B 특정 날짜 문화루트 선택</text><text x="472" y="253" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="17" font-weight="400" fill="#334155">현재 선택 상태가 있으면 LF-09로 다시 진입 가능</text><rect x="70" y="315" width="700" height="175" rx="18" fill="white" stroke="#6C7CFF" stroke-width="2"/><path d="M88 315 H752 Q770 315 770 333 V368 H70 V333 Q70 315 88 315" fill="#EEF1FF"/><text x="92" y="350" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="23" font-weight="700" fill="#111827">3. 즉시 추천 A · LF-02 → LF-03</text><text x="92" y="390" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="17" font-weight="400" fill="#334155">현재 조건·선택 맥락 → 후보 판단 → 결과 상태</text><text x="92" y="418" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="17" font-weight="400" fill="#334155">조건 충족 / 추가 확인 필요 / 조건 완화 대안 → 후보 비교</text><text x="92" y="446" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="17" font-weight="400" fill="#334155">적합 후보 없음 → 0건 안내·조건 조정</text><rect x="830" y="315" width="700" height="175" rx="18" fill="white" stroke="#6C7CFF" stroke-width="2"/><path d="M848 315 H1512 Q1530 315 1530 333 V368 H830 V333 Q830 315 848 315" fill="#EEF1FF"/><text x="852" y="350" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="23" font-weight="700" fill="#111827">4. 특정 날짜 문화루트 B · LF-04 → LF-05</text><text x="852" y="390" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="17" font-weight="400" fill="#334155">날짜·시작점·시작·종료 4값 → 2~3개 경험 조합</text><text x="852" y="418" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="17" font-weight="400" fill="#334155">