"1033" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="15" font-weight="400" fill="#334155">미확인 ≠ 무료·예약 불필요·이용 보장</text><text x="92" y="1061" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="15" font-weight="400" fill="#334155">AI·위치·여행 맥락 안내</text><rect x="585" y="930" width="430" height="140" rx="18" fill="white" stroke="#39D98A" stroke-width="2"/><path d="M603 930 H997 Q1015 930 1015 948 V983 H585 V948 Q585 930 603 930" fill="#ECFFF4"/><text x="607" y="965" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="21" font-weight="700" fill="#111827">7. 현재 선택 상태 · LF-09</text><text x="607" y="1005" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="15" font-weight="400" fill="#334155">P-09 1회 선호 · My Page · A/B 현재 선택</text><text x="607" y="1033" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="15" font-weight="400" fill="#334155">B는 장소·순서·예정시간·미확인 상태 유지</text><text x="607" y="1061" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="15" font-weight="400" fill="#334155">선택 ≠ 예약·참여·방문 · 재탐색만으로 삭제 금지</text><rect x="1100" y="930" width="430" height="140" rx="18" fill="white" stroke="#B7C2CF" stroke-width="2"/><path d="M1118 930 H1512 Q1530 930 1530 948 V983 H1100 V948 Q1100 930 1118 930" fill="#F4F7FA"/><text x="1122" y="965" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="21" font-weight="700" fill="#111827">방문 이후 · LF-10 (조건부)</text><text x="1122" y="1005" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="16" font-weight="400" fill="#334155">개발 구현 가능 확인 완료 · MVP 포함 조건부</text><text x="1122" y="1033" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="16" font-weight="400" fill="#334155">실제 방문은 A/B 완료조건이 아님</text><text x="60" y="1133" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="16" font-weight="400" fill="#64748B">이 도식은 IA 구조·관계를 설명하며 기획 사용자 흐름 단계와 최종 UX 화면 수를 1:1로 고정하지 않습니다.</text><text x="60" y="1162" font-family="Arial, &quot;Noto Sans KR&quot;, sans-serif" font-size="15" font-weight="400" fill="#64748B">상세 IA ID·상태는 Google Sheet 「IA 작업맵」, 확정 기획 기준은 「KONNECT 제품 기획 기준서」 §11–12를 우선합니다.</text></svg>