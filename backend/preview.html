<!doctype html>
<html lang="ko">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LAB678 나들이 찾기 · 개발 점검</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
<style>
#map {height: 260px}
#list li {padding: .6rem}
#list li[aria-current="true"] {outline: 3px solid #174d8c}
.event-pin {background: white; border: 2px solid #174d8c; border-radius: 50%; text-align:center; color: #173854; font: bold 16px/26px sans-serif}
.event-pin.active {background: #174d8c; color: white}
</style>
<h1>나들이 찾기</h1>
<p>개발 점검 화면 · 출처 서울특별시 서울문화포털</p>
<form id="form">
<fieldset id="fields" disabled><legend>출발 조건</legend>
<p><label>출발지 이름 <input name="label" required></label>
<label>위도 <input name="lat" type="number" step="any" min="-90" max="90" required></label>
<label>경도 <input name="lng" type="number" step="any" min="-180" max="180" required></label></p>
<p>입력 좌표에서 가까운 순으로 검색합니다. 출발지를 바꾸면 좌표도 확인해 주세요.
기본 위치 <a href="https://www.openstreetmap.org/node/3436803670">© OpenStreetMap contributors</a></p>
<p><label>시작(한국 시각) <input name="start" type="datetime-local" required></label>
<label>종료 <input name="end" type="datetime-local" required></label></p>
<label>분류 <select name="category"><option>전시</option><option>전체</option><option>국악</option><option>클래식</option><option>콘서트</option><option>연극</option></select></label>
<label>조회 <select name="mode"><option value="live">실시간</option><option value="recorded">10월 31일 기록 재생 (전시·전체)</option></select></label>
<p><label>추가 요청 메모 <input name="note" aria-describedby="voice-help"></label>
<button type="button" id="listen">한 번 말하기</button>
<button type="button" id="apply-note">분류 반영</button></p>
<p id="voice-help">한국어 음성 또는 글로 입력하세요. 브라우저 음성 인식 서비스를 사용합니다.
메모에서 분류 하나만 반영할 수 있습니다. 위치와 시간은 위 입력란에서 확인해 주세요.</p>
<p id="voice-status" role="status"></p>
<button>추천받기</button></fieldset></form>
<p id="status" role="status"></p>
<section id="results" hidden><button id="back">조건 바꾸기</button>
<p id="map-note" role="status"></p><div id="map" hidden aria-label="추천 행사 지도"></div>
<p id="selection" role="status"></p><button type="button" id="read" disabled>선택한 행사 읽기</button>
<p id="read-status" role="status"></p><ol id="list"></ol></section>
<script>
const form = document.querySelector("#form");
const fields = form.elements;
const statusText = document.querySelector("#status");
const results = document.querySelector("#results");
const list = document.querySelector("#list");
const selection = document.querySelector("#selection");

/** 저장된 대표 입력으로 폼을 초기화한다. */
async function init() {
  const request = await (await fetch("/example")).json();
  for (const name of ["label","lat","lng"]) fields.namedItem(name).value = request.start_location[name];
  fields.start.value = request.start_at.slice(0,16);
  fields.end.value = request.end_at.slice(0,16);
  fields.category.value = request.category;
  fields.fields.disabled = false;
}

let map;
let markerGroup;
let latestCandidates = [];
const markers = new Map();
const mapBox = document.querySelector("#map");
const mapNote = document.querySelector("#map-note");

/** 선택한 카드와 핀을 동일 ID로 강조한다. */
function selectEvent(item) {
  selection.textContent = "선택한 행사 · " + item.title;
  selection.dataset.id = item.id;
  stopReading();
  const card = [...list.children].find(entry => entry.dataset.id === item.id);
  readButton.dataset.text = card.querySelector("strong").textContent + ". " + card.querySelector("p").textContent;
  readButton.disabled = !window.speechSynthesis;
  for (const card of list.children) card.setAttribute("aria-current", String(card.dataset.id === item.id));
  for (const [id, marker] of markers) marker.getElement()?.classList.toggle("active", id === item.id);
  const marker = markers.get(item.id);
  if (marker) map.panTo(marker.getLatLng(), {animate:false});
}

/** 현재 응답의 유효 좌표만 표시한다. 지도 장애에도 카드와 선택 상태를 보존한다. */
function drawMap() {
  markers.clear();
  markerGroup?.clearLayers();
  const points = latestCandidates.filter(item => Number.isFinite(item.lat) && Number.isFinite(item.lng));
  mapBox.hidden = !window.L || !points.length;
  mapNote.textContent = !points.length ? "표시할 좌표가 없습니다." :
    !window.L ? "지도를 불러올 수 없으면 아래 행사 목록을 이용해 주세요." : "";
  if (mapBox.hidden) return;
  if (!map) {
    map = L.map(mapBox);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>',
      maxZoom:19
    }).on("tileerror", () => { mapNote.textContent = "일부 지도 배경을 불러오지 못했습니다. 아래 목록에서 선택할 수 있습니다."; }).addTo(map);
    markerGroup = L.layerGroup().addTo(map);
  }
  map.invalidateSize();
  map.fitBounds(points.map(item => [item.lat,item.lng]), {padding:[28,28],maxZoom:15,animate:false});
  for (const item of points) {
    const number = latestCandidates.indexOf(item) + 1;
    const icon = L.divIcon({className:"event-pin",html:String(number),iconSize:[26,26]});
    const marker = L.marker([item.lat,item.lng],{icon,title:item.title,alt:item.title}).addTo(markerGroup);
    marker.on("click", () => { selectEvent(item); list.querySelector('[aria-current="true"]').scrollIntoView({block:"nearest"}); });
    marker.getElement().classList.toggle("active", selection.dataset.id === item.id);
    markers.set(item.id, marker);
  }
}

/** 공급자 문자열은 텍스트로 출력하고 같은 행사 ID로 선택 상태를 표시한다. */
function showCard(item) {
  const li = document.createElement("li");
  li.dataset.id = item.id;
  const title = document.createElement("strong");
  title.textContent = item.title;
  const detail = document.createElement("p");
  const distance = item.distance_km === null ? "위치 확인 필요" : "직선 " + item.distance_km + " km";
  detail.textContent = [item.venue, distance, item.opening_info || "시간 미확인", item.fee_type || "요금 분류 미확인",
    item.price_info || "상세 요금 미확인", item.audience || "이용 대상 확인 필요", ...item.checks_required].join(" · ");
  const source = document.createElement("a");
  source.href = item.official_url;
  source.textContent = "서울문화포털 상세";
  source.target = "_blank";
  source.rel = "noopener";
  const select = document.createElement("button");
  select.textContent = "이 행사 선택";
  select.onclick = () => selectEvent(item);
  li.append(title, detail, select, " ", source);
  list.append(li);
}

const voiceStatus = document.querySelector("#voice-status");
const readButton = document.querySelector("#read");
const readStatus = document.querySelector("#read-status");
const listenButton = document.querySelector("#listen");
const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let session;
let speaking;

/** 현재 음성 재생을 중지하고 이전 카드의 읽기 상태를 지운다. */
function stopReading() {
  speaking = null;
  window.speechSynthesis?.cancel();
  readStatus.textContent = window.speechSynthesis ? "" : "읽기 미지원 · 화면의 글을 확인해 주세요.";
  readButton.disabled = true;
}

/** 사용자 클릭에서만 한국어 한 번 듣기를 시작하고 실패 시 메모를 보존한다. */
function listen() {
  if (!Recognition) {
    voiceStatus.textContent = "음성 인식 미지원 · 추가 요청을 글로 입력해 주세요.";
    fields.note.focus();
    return;
  }
  if (session) { session.stop(); return; }
  const recognition = new Recognition();
  session = recognition;
  recognition.lang = "ko-KR";
  recognition.interimResults = false;
  listenButton.textContent = "듣기 종료";
  voiceStatus.textContent = "말씀해 주세요.";
  recognition.onresult = event => {
    if (session !== recognition) return;
    const words = event.results[0][0].transcript;
    fields.note.value = [fields.note.value.trim(), words].filter(Boolean).join(" ");
    voiceStatus.textContent = "전사한 문장을 확인·수정한 뒤 분류를 반영해 주세요.";
  };
  recognition.onerror = event => {
    if (session !== recognition) return;
    voiceStatus.textContent = (event.error === "not-allowed" ? "마이크 권한 거부" : "음성 인식 실패") +
      " · 입력한 내용을 유지했습니다. 글로 계속해 주세요.";
  };
  recognition.onend = () => {
    if (session !== recognition) return;
    session = null; listenButton.textContent = "한 번 말하기";
    if (voiceStatus.textContent === "말씀해 주세요.") voiceStatus.textContent = "듣기 종료 · 글로 계속할 수 있습니다.";
  };
  try { recognition.start(); }
  catch { recognition.onend(); voiceStatus.textContent = "듣기를 시작하지 못했습니다. 글로 계속해 주세요."; }
}

/** 기술 검증에서 명확한 분류 단어 한 개만 사용자가 확인해 적용하도록 한다. */
function applyNote() {
  const note = fields.note.value.trim();
  const matches = [...fields.category.options].filter(o => note.includes(o.value));
  if (matches.length !== 1 || /말고|제외|싫|아니|않|빼/.test(note)) {
    voiceStatus.textContent = "원하는 분류를 목록에서 직접 선택해 주세요.";
    fields.category.focus();
    return;
  }
  fields.category.value = matches[0].value;
  voiceStatus.textContent = matches[0].value + " 분류를 반영했습니다. 추천 전 조건을 확인해 주세요.";
}

/** 선택한 카드의 화면 문장만 한국어로 읽는다. */
function readSelection() {
  const synth = window.speechSynthesis;
  if (!synth || !readButton.dataset.text) return;
  synth.cancel();
  const utterance = new SpeechSynthesisUtterance(readButton.dataset.text);
  speaking = utterance;
  utterance.lang = "ko-KR";
  utterance.onend = () => { if (speaking === utterance) readStatus.textContent = "읽기 종료"; };
  utterance.onerror = () => { if (speaking === utterance) readStatus.textContent = "읽기 실패 · 화면의 글을 확인해 주세요."; };
  readStatus.textContent = "한국어 읽기 요청";
  synth.speak(utterance);
}

listenButton.onclick = listen;
document.querySelector("#apply-note").onclick = applyNote;
readButton.onclick = readSelection;

/** 입력을 유지하면서 재조회하고 시도별 결과·실패를 구분한다. */
async function search(event) {
  event.preventDefault();
  const data = Object.fromEntries(new FormData(form));
  if (session) { const current = session; session = null; current.abort(); listenButton.textContent = "한 번 말하기"; }
  stopReading();
  fields.fields.disabled = true;
  statusText.textContent = "문화정보 조회 중…";
  list.replaceChildren();
  selection.textContent = "";
  delete selection.dataset.id;
  try {
    const response = await fetch("/preview/recommend", {method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({request_kind:"place",start_location:{label:data.label,lat:data.lat,lng:data.lng},
        start_at:data.start + ":00+09:00",end_at:data.end + ":00+09:00",category:data.category,mode:data.mode})});
    const body = await response.json();
    if (!response.ok) throw new Error(body.message);
    form.hidden = true;
    results.hidden = false;
    const scope = (body.mode === "live" ? "실시간" : "기록 재생") + " · 서울시 검색 " + body.source_total +
      "건 중 조회 " + body.searched_count + "건 · 확인 " + body.source_checked_at;
    statusText.textContent = scope + (body.status === "no_results" ? " · 조회 범위에서 맞는 행사가 없습니다." : " · 후보 " + body.candidates.length + "건");
    body.candidates.forEach(showCard);
    latestCandidates = body.candidates;
    drawMap();
  } catch (error) { statusText.textContent = error.message || "조회 실패"; }
  finally { fields.fields.disabled = false; }
}

form.onsubmit = search;
fields.label.oninput = () => { fields.lat.value = ""; fields.lng.value = ""; };
document.querySelector("#back").onclick = () => {
  stopReading(); results.hidden = true; form.hidden = false; statusText.textContent = ""; fields.category.focus();
};
init().catch(() => { statusText.textContent = "대표 요청을 읽지 못했습니다. 새로고침해 주세요."; });
</script>
<script async src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous" onload="if (!results.hidden) drawMap()"></script></html>
